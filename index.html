<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Coke Mouse</title>
    <script id="cm-theme-bootstrap">(function(){
      try {
        var s = localStorage.getItem("cm.theme");
        if(!s){ s = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
        document.documentElement.setAttribute("data-theme", s);
      } catch(e){}
    })();</script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/ui/theme.ts"></script>
  </body>
</html>
